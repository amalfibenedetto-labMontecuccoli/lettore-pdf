<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
    <title>Lettore PDF</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f1f1f3; }
      #pdfcraft_loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 20px system-ui, sans-serif; color: #666; }
      canvas { width: 100%; height: 100%; display: block; outline: none; }
      @media (prefers-color-scheme: dark) { html, body { background: #19191c; } }
    </style>
  </head>
  <body>
    <div id="pdfcraft_loading">Caricamento di Lettore PDF&hellip;</div>
    <canvas id="pdfcraft"></canvas>
  </body>
</html>
